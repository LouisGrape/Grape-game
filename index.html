<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grape Tree Clicker</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --dark: #071b0b;
    --dark2: #102d14;
    --green: #63d63d;
    --light-green: #a5ff70;
    --muted: #a9c6a5;
    --gold: #ffd95a;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;

    font-family: Arial, Helvetica, sans-serif;
    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at 20% 10%,
            #327b36 0%,
            transparent 25%
        ),
        radial-gradient(
            circle at 85% 20%,
            #205b29 0%,
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #071b0b,
            #12351a
        );
}

.game {
    width: 980px;
    max-width: 100%;

    padding: 34px;

    background:
        linear-gradient(
            145deg,
            rgba(13, 33, 18, .98),
            rgba(7, 20, 10, .98)
        );

    border: 1px solid rgba(139, 220, 104, .25);
    border-radius: 30px;

    text-align: center;

    box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.04);
}

/* HEADER */

.logo {
    font-size: 48px;
    margin-bottom: 5px;
}

h1 {
    margin: 0;

    font-size: clamp(34px, 6vw, 54px);

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #a9ff82
        );

    -webkit-background-clip: text;
    color: transparent;
}

.subtitle {
    color: var(--muted);
    margin-top: 8px;
}


/* STATS */

.stats {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;

    margin-top: 25px;
}

.stat {
    min-width: 200px;

    padding: 15px 25px;

    background: rgba(255,255,255,.035);

    border: 1px solid rgba(139,220,104,.15);

    border-radius: 16px;
}

.stat-label {
    color: var(--muted);

    font-size: 13px;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.stat-value {
    margin-top: 5px;

    font-size: 28px;
    font-weight: bold;
}


/* TREE AREA */

.tree-section {
    position: relative;

    height: 390px;

    display: flex;
    justify-content: center;
    align-items: center;

    margin-top: 10px;
}


/* TREE BUTTON */

.tree-button {
    position: relative;

    width: 360px;
    height: 360px;

    border: 0;
    padding: 0;

    background: transparent;

    cursor: pointer;

    transition:
        transform .12s ease,
        filter .12s ease;

    filter:
        drop-shadow(
            0 25px 20px rgba(0,0,0,.4)
        );
}

.tree-button:hover {
    transform: scale(1.035);
}

.tree-button:active {
    transform: scale(.94);
}


/* SVG */

.tree-svg {
    width: 100%;
    height: 100%;

    overflow: visible;
}

.tree-shadow {
    fill: rgba(0,0,0,.25);
}

.trunk {
    fill: url(#trunkGradient);

    stroke: #472612;
    stroke-width: 3;
}

.branch {
    fill: none;

    stroke: #6f3b1d;
    stroke-width: 20;

    stroke-linecap: round;
}

.leaf-main {
    fill: url(#leafGradient);

    stroke: #225b25;
    stroke-width: 4;
}

.leaf-light {
    fill: #65c94a;

    opacity: .8;
}

.leaf-dark {
    fill: #23782d;

    opacity: .8;
}


/* GREEN GRAPES */

.grape {
    fill: url(#grapeGradient);

    stroke: #397a25;
    stroke-width: 3;
}

.grape-highlight {
    fill: rgba(255,255,255,.65);
}

.stem {
    fill: none;

    stroke: #426e20;
    stroke-width: 7;

    stroke-linecap: round;
}


/* CLICK POPUP */

.click-text {
    position: absolute;

    pointer-events: none;

    color: var(--light-green);

    font-size: 24px;
    font-weight: bold;

    text-shadow:
        0 2px 8px rgba(0,0,0,.7);

    animation:
        floatUp .75s ease-out forwards;
}

.green-grape-popup {
    display: inline-flex;

    position: relative;

    width: 30px;
    height: 30px;

    margin-left: 5px;

    vertical-align: middle;
}

.popup-grape {
    position: absolute;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    border: 1px solid #3f7e20;

    box-shadow:
        inset -2px -2px 0 rgba(30,80,15,.25);
}

.popup-g1 {
    left: 10px;
    top: 0;
    background: #91df43;
}

.popup-g2 {
    left: 5px;
    top: 7px;
    background: #75c832;
}

.popup-g3 {
    left: 15px;
    top: 7px;
    background: #82d63a;
}

.popup-g4 {
    left: 0;
    top: 14px;
    background: #64b52b;
}

.popup-g5 {
    left: 10px;
    top: 14px;
    background: #79cd34;
}

.popup-g6 {
    left: 20px;
    top: 14px;
    background: #5fa927;
}

.popup-g7 {
    left: 10px;
    top: 22px;
    background: #70c52f;
}

@keyframes floatUp {
    0% {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }

    100% {
        opacity: 0;
        transform:
            translateY(-90px)
            scale(1.15);
    }
}


/* UPGRADES */

.upgrades {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 16px;

    margin-top: 15px;
}

.upgrade {
    min-height: 170px;

    padding: 22px;

    border: 1px solid
        rgba(139,220,104,.2);

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            rgba(29,63,31,.9),
            rgba(14,34,17,.95)
        );

    color: white;

    cursor: pointer;

    transition:
        transform .15s ease,
        border-color .15s ease,
        background .15s ease,
        box-shadow .15s ease;
}

.upgrade:hover:not(:disabled) {
    transform: translateY(-6px);

    border-color:
        rgba(156,255,104,.7);

    box-shadow:
        0 12px 30px rgba(0,0,0,.3);

    background:
        linear-gradient(
            145deg,
            #214b24,
            #122d16
        );
}

.upgrade:active:not(:disabled) {
    transform:
        translateY(-1px)
        scale(.98);
}

.upgrade:disabled {
    opacity: .4;

    cursor: not-allowed;
}

.upgrade-icon {
    font-size: 42px;
}

.upgrade-name {
    margin-top: 8px;

    font-size: 20px;
    font-weight: bold;
}

.upgrade-effect {
    margin-top: 6px;

    color: var(--muted);

    font-size: 14px;
}

.cost {
    margin-top: 14px;

    color: var(--gold);

    font-weight: bold;
}


/* MESSAGE */

.message {
    height: 30px;

    margin-top: 8px;

    color: #b9ff91;

    font-weight: bold;
}


/* RESET */

.reset {
    display: block;

    margin: 24px auto 0;

    padding: 12px 26px;

    border: 1px solid
        rgba(255,255,255,.12);

    border-radius: 12px;

    background: #1b3b20;

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition: .15s;
}

.reset:hover {
    background: #28582e;
}


/* MOBILE */

@media (max-width: 750px) {

    body {
        padding: 10px;
    }

    .game {
        padding: 22px 16px;
    }

    .upgrades {
        grid-template-columns: 1fr;
    }

    .tree-section {
        height: 320px;
    }

    .tree-button {
        width: 300px;
        height: 300px;
    }

    .stats {
        flex-direction: column;
    }

    .stat {
        width: 100%;
    }
}
</style>
</head>


<body>

<div class="game">

    <div class="logo">
        🌳🍇
    </div>

    <h1>
        Grape Tree Clicker
    </h1>

    <div class="subtitle">
        Grow your green grape empire!
    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat">

            <div class="stat-label">
                Green Grapes
            </div>

            <div
                class="stat-value"
                id="grapes"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Production
            </div>

            <div
                class="stat-value"
                id="perSecond"
            >
                0 / sec
            </div>

        </div>

    </div>


    <!-- TREE -->

    <div
        class="tree-section"
        id="treeArea"
    >

        <button
            class="tree-button"
            id="tree"
            aria-label="Click the grape tree"
        >

            <svg
                class="tree-svg"
                viewBox="0 0 360 360"
                xmlns="http://www.w3.org/2000/svg"
            >

                <defs>

                    <!-- Leaf gradient -->

                    <linearGradient
                        id="leafGradient"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1"
                    >
                        <stop
                            offset="0%"
                            stop-color="#8be35a"
                        />

                        <stop
                            offset="45%"
                            stop-color="#45aa3a"
                        />

                        <stop
                            offset="100%"
                            stop-color="#23772b"
                        />
                    </linearGradient>


                    <!-- Trunk gradient -->

                    <linearGradient
                        id="trunkGradient"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1"
                    >
                        <stop
                            offset="0%"
                            stop-color="#a86431"
                        />

                        <stop
                            offset="50%"
                            stop-color="#75401f"
                        />

                        <stop
                            offset="100%"
                            stop-color="#482414"
                        />
                    </linearGradient>


                    <!-- Green grape gradient -->

                    <radialGradient
                        id="grapeGradient"
                        cx="30%"
                        cy="25%"
                    >

                        <stop
                            offset="0%"
                            stop-color="#e1ff9b"
                        />

                        <stop
                            offset="35%"
                            stop-color="#8bdc3c"
                        />

                        <stop
                            offset="75%"
                            stop-color="#54a92c"
                        />

                        <stop
                            offset="100%"
                            stop-color="#347720"
                        />

                    </radialGradient>

                </defs>


                <!-- Ground -->

                <ellipse
                    class="tree-shadow"
                    cx="180"
                    cy="337"
                    rx="115"
                    ry="17"
                />


                <!-- Branches -->

                <path
                    class="branch"
                    d="
                        M180 275
                        C150 235
                        120 215
                        80 195
                    "
                />

                <path
                    class="branch"
                    d="
                        M180 270
                        C210 230
                        245 210
                        285 190
                    "
                />


                <!-- Trunk -->

                <path
                    class="trunk"
                    d="
                        M155 320
                        C160 275 155 235 165 195
                        C172 168 185 168 194 195
                        C205 235 200 275 207 320
                        Z
                    "
                />


                <!-- Leaves -->

                <circle
                    class="leaf-main"
                    cx="115"
                    cy="155"
                    r="72"
                />

                <circle
                    class="leaf-main"
                    cx="180"
                    cy="115"
                    r="92"
                />

                <circle
                    class="leaf-main"
                    cx="250"
                    cy="155"
                    r="72"
                />

                <circle
                    class="leaf-main"
                    cx="150"
                    cy="180"
                    r="75"
                />

                <circle
                    class="leaf-main"
                    cx="215"
                    cy="180"
                    r="75"
                />


                <!-- Leaf highlights -->

                <ellipse
                    class="leaf-light"
                    cx="150"
                    cy="80"
                    rx="42"
                    ry="25"
                />

                <ellipse
                    class="leaf-light"
                    cx="105"
                    cy="135"
                    rx="28"
                    ry="17"
                />

                <ellipse
                    class="leaf-dark"
                    cx="260"
                    cy="155"
                    rx="35"
                    ry="22"
                />


                <!-- Grape stems -->

                <path
                    class="stem"
                    d="
                        M180 125
                        C178 145
                        175 160
                        165 180
                    "
                />

                <path
                    class="stem"
                    d="
                        M235 145
                        C225 160
                        220 175
                        215 190
                    "
                />


                <!-- GREEN GRAPE CLUSTER -->

                <g>

                    <circle
                        class="grape"
                        cx="165"
                        cy="155"
                        r="22"
                    />

                    <circle
                        class="grape"
                        cx="195"
                        cy="155"
                        r="22"
                    />

                    <circle
                        class="grape"
                        cx="150"
                        cy="178"
                        r="22"
                    />

                    <circle
                        class="grape"
                        cx="180"
                        cy="180"
                        r="22"
                    />

                    <circle
                        class="grape"
                        cx="210"
                        cy="180"
                        r="22"
                    />

                    <circle
                        class="grape"
                        cx="165"
                        cy="205"
                        r="22"
                    />

                    <circle
                        class="grape"
                        cx="195"
                        cy="205"
                        r="22"
                    />

                    <circle
                        class="grape"
                        cx="180"
                        cy="230"
                        r="22"
                    />


                    <!-- Highlights -->

                    <circle
                        class="grape-highlight"
                        cx="158"
                        cy="149"
                        r="5"
                    />

                    <circle
                        class="grape-highlight"
                        cx="188"
                        cy="149"
                        r="5"
                    />

                    <circle
                        class="grape-highlight"
                        cx="143"
                        cy="172"
                        r="5"
                    />

                    <circle
                        class="grape-highlight"
                        cx="173"
                        cy="174"
                        r="5"
                    />

                    <circle
                        class="grape-highlight"
                        cx="203"
                        cy="174"
                        r="5"
                    />

                    <circle
                        class="grape-highlight"
                        cx="158"
                        cy="199"
                        r="5"
                    />

                    <circle
                        class="grape-highlight"
                        cx="188"
                        cy="199"
                        r="5"
                    />

                </g>

            </svg>

        </button>

    </div>


    <div
        class="message"
        id="message"
    ></div>


    <!-- UPGRADES -->

    <div class="upgrades">

        <!-- VINE -->

        <button
            class="upgrade"
            id="vine"
        >

            <div class="upgrade-icon">
                🌱
            </div>

            <div class="upgrade-name">
                Grape Vine
            </div>

            <div class="upgrade-effect">
                +1 grape per second
            </div>

            <div
                class="cost"
                id="vineCost"
            >
                Cost: 25
            </div>

        </button>


        <!-- FARMER -->

        <button
            class="upgrade"
            id="farmer"
        >

            <div class="upgrade-icon">
                👨‍🌾
            </div>

            <div class="upgrade-name">
                Grape Farmer
            </div>

            <div class="upgrade-effect">
                +3 grapes per second
            </div>

            <div
                class="cost"
                id="farmerCost"
            >
                Cost: 150
            </div>

        </button>


        <!-- FACTORY -->

        <button
            class="upgrade"
            id="factory"
        >

            <div class="upgrade-icon">
                🏭
            </div>

            <div class="upgrade-name">
                Grape Factory
            </div>

            <div class="upgrade-effect">
                +50 grapes per second
            </div>

            <div
                class="cost"
                id="factoryCost"
            >
                Cost: 750
            </div>

        </button>

    </div>


    <!-- RESET -->

    <button
        class="reset"
        id="reset"
    >
        Reset Game
    </button>

</div>


<script>

/* =========================
   GAME DATA
========================= */

let grapes =
    Number(localStorage.getItem("grapes")) || 0;

let grapesPerSecond =
    Number(
        localStorage.getItem(
            "grapesPerSecond"
        )
    ) || 0;


let vineCost =
    Number(
        localStorage.getItem(
            "vineCost"
        )
    ) || 25;

let farmerCost =
    Number(
        localStorage.getItem(
            "farmerCost"
        )
    ) || 150;

let factoryCost =
    Number(
        localStorage.getItem(
            "factoryCost"
        )
    ) || 750;


/* =========================
   ELEMENTS
========================= */

const grapesDisplay =
    document.getElementById(
        "grapes"
    );

const perSecondDisplay =
    document.getElementById(
        "perSecond"
    );

const tree =
    document.getElementById(
        "tree"
    );

const treeArea =
    document.getElementById(
        "treeArea"
    );

const message =
    document.getElementById(
        "message"
    );


const vineButton =
    document.getElementById(
        "vine"
    );

const farmerButton =
    document.getElementById(
        "farmer"
    );

const factoryButton =
    document.getElementById(
        "factory"
    );


const vineCostDisplay =
    document.getElementById(
        "vineCost"
    );

const farmerCostDisplay =
    document.getElementById(
        "farmerCost"
    );

const factoryCostDisplay =
    document.getElementById(
        "factoryCost"
    );


/* =========================
   SAVE
========================= */

function saveGame() {

    localStorage.setItem(
        "grapes",
        grapes
    );

    localStorage.setItem(
        "grapesPerSecond",
        grapesPerSecond
    );

    localStorage.setItem(
        "vineCost",
        vineCost
    );

    localStorage.setItem(
        "farmerCost",
        farmerCost
    );

    localStorage.setItem(
        "factoryCost",
        factoryCost
    );
}


/* =========================
   UPDATE DISPLAY
========================= */

function updateDisplay() {

    grapesDisplay.textContent =
        Math.floor(
            grapes
        ).toLocaleString();


    perSecondDisplay.textContent =
        grapesPerSecond
        .toLocaleString()
        + " / sec";


    vineCostDisplay.textContent =
        "Cost: "
        + vineCost.toLocaleString();


    farmerCostDisplay.textContent =
        "Cost: "
        + farmerCost.toLocaleString();


    factoryCostDisplay.textContent =
        "Cost: "
        + factoryCost.toLocaleString();


    vineButton.disabled =
        grapes < vineCost;

    farmerButton.disabled =
        grapes < farmerCost;

    factoryButton.disabled =
        grapes < factoryCost;
}


/* =========================
   GREEN GRAPE POPUP
========================= */

function createPopup() {

    const popup =
        document.createElement(
            "div"
        );

    popup.className =
        "click-text";


    const plus =
        document.createElement(
            "span"
        );

    plus.textContent =
        "+1";


    const grape =
        document.createElement(
            "span"
        );

    grape.className =
        "green-grape-popup";


    const positions = [
        ["popup-g1"],
        ["popup-g2"],
        ["popup-g3"],
        ["popup-g4"],
        ["popup-g5"],
        ["popup-g6"],
        ["popup-g7"]
    ];


    positions.forEach(
        function(classes) {

            const dot =
                document.createElement(
                    "span"
                );

            dot.className =
                "popup-grape "
                + classes[0];

            grape.appendChild(dot);

        }
    );


    popup.appendChild(
        plus
    );

    popup.appendChild(
        grape
    );


    popup.style.left =
        (40 + Math.random() * 20)
        + "%";

    popup.style.top =
        (40 + Math.random() * 15)
        + "%";


    treeArea.appendChild(
        popup
    );


    setTimeout(
        function() {

            popup.remove();

        },
        750
    );
}


/* =========================
   MESSAGE
========================= */

function showMessage(text) {

    message.textContent =
        text;


    setTimeout(
        function() {

            message.textContent =
                "";

        },
        1300
    );
}


/* =========================
   CLICK TREE
========================= */

tree.addEventListener(
    "click",
    function() {

        grapes += 1;

        createPopup();

        updateDisplay();

        saveGame();

    }
);


/* =========================
   BUY VINE
========================= */

vineButton.addEventListener(
    "click",
    function() {

        if (
            grapes <
            vineCost
        ) {
            return;
        }


        grapes -= vineCost;

        grapesPerSecond += 1;


        vineCost =
            Math.floor(
                vineCost * 1.15
            );


        showMessage(
            "🌱 Grape Vine purchased!"
        );


        updateDisplay();

        saveGame();

    }
);


/* =========================
   BUY FARMER
========================= */

farmerButton.addEventListener(
    "click",
    function() {

        if (
            grapes <
            farmerCost
        ) {
            return;
        }


        grapes -= farmerCost;

        grapesPerSecond += 3;


        farmerCost =
            Math.floor(
                farmerCost * 1.18
            );


        showMessage(
            "👨‍🌾 Grape Farmer hired!"
        );


        updateDisplay();

        saveGame();

    }
);


/* =========================
   BUY FACTORY
========================= */

factoryButton.addEventListener(
    "click",
    function() {

        if (
            grapes <
            factoryCost
        ) {
            return;
        }


        grapes -= factoryCost;

        grapesPerSecond += 50;


        factoryCost =
            Math.floor(
                factoryCost * 1.20
            );


        showMessage(
            "🏭 Grape Factory purchased!"
        );


        updateDisplay();

        saveGame();

    }
);


/* =========================
   AUTOMATIC PRODUCTION
========================= */

setInterval(
    function() {

        grapes += grapesPerSecond;

        updateDisplay();

        saveGame();

    },
    1000
);


/* =========================
   RESET
========================= */

document
    .getElementById("reset")
    .addEventListener(
        "click",
        function() {

            if (
                !confirm(
                    "Are you sure you want to reset your grape empire?"
                )
            ) {
                return;
            }


            grapes = 0;

            grapesPerSecond = 0;

            vineCost = 25;

            farmerCost = 150;

            factoryCost = 750;


            saveGame();

            updateDisplay();


            showMessage(
                "🔄 Game reset!"
            );

        }
    );


/* START */

updateDisplay();

</script>

</body>
</html>
