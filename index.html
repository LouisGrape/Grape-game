<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grape Clicker 🍇</title>

<style>
:root {
    --dark: #071b0b;
    --dark2: #102d14;
    --green: #63d63d;
    --light-green: #a5ff70;
    --muted: #a9c6a5;
    --gold: #ffd95a;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #214d27, var(--dark) 65%);
    color: white;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 25px 10px 10px;
}

header h1 {
    margin: 0;
    font-size: 42px;
    color: var(--light-green);
    text-shadow: 0 0 20px rgba(99,214,61,.4);
}

header p {
    color: var(--muted);
}

.game {
    width: min(1200px, 95%);
    margin: auto;
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    gap: 20px;
}

.panel {
    background: rgba(16,45,20,.95);
    border: 1px solid rgba(165,255,112,.15);
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,.25);
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
}

.stat {
    background: #0b2410;
    padding: 14px;
    border-radius: 15px;
    text-align: center;
}

.stat-number {
    display: block;
    font-size: 26px;
    font-weight: bold;
    color: var(--light-green);
}

.stat-label {
    color: var(--muted);
    font-size: 12px;
}

.tree-area {
    min-height: 550px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.tree-button {
    border: none;
    background: transparent;
    cursor: pointer;
    transition: transform .1s;
}

.tree-button:hover {
    transform: scale(1.03);
}

.tree-button:active {
    transform: scale(.94);
}

.tree-svg {
    width: min(430px, 85vw);
    filter: drop-shadow(0 15px 20px rgba(0,0,0,.35));
}

.click-text {
    color: var(--muted);
    margin-top: 5px;
}

.popup {
    position: absolute;
    pointer-events: none;
    animation: popup 900ms ease-out forwards;
    display: flex;
    align-items: center;
    gap: 7px;
    font-weight: bold;
    font-size: 20px;
    z-index: 20;
}

.popup.critical-popup {
    color: var(--gold);
    font-size: 26px;
}

@keyframes popup {
    0% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    100% {
        opacity: 0;
        transform: translateY(-100px) scale(1.2);
    }
}

.green-grape-popup {
    position: relative;
    width: 30px;
    height: 35px;
}

.popup-grape {
    position: absolute;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #d8ff9b, #65d83d 45%, #238c26);
}

.popup-g1 { left: 9px; top: 0; }
.popup-g2 { left: 3px; top: 7px; }
.popup-g3 { left: 15px; top: 7px; }
.popup-g4 { left: 0; top: 15px; }
.popup-g5 { left: 9px; top: 15px; }
.popup-g6 { left: 18px; top: 15px; }
.popup-g7 { left: 9px; top: 24px; }

.upgrades-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.upgrades-title h2 {
    margin-top: 0;
}

.upgrade-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 650px;
    overflow-y: auto;
    padding-right: 5px;
}

.upgrade {
    background: #0b2410;
    border: 1px solid rgba(165,255,112,.1);
    border-radius: 15px;
    padding: 14px;
    display: grid;
    grid-template-columns: 55px 1fr auto;
    gap: 12px;
    align-items: center;
    transition: .2s;
}

.upgrade:hover {
    border-color: rgba(165,255,112,.4);
    transform: translateY(-2px);
}

.upgrade-icon {
    font-size: 35px;
    text-align: center;
}

.upgrade h3 {
    margin: 0 0 4px;
    font-size: 17px;
}

.upgrade p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
}

.upgrade-count {
    color: var(--gold);
    font-size: 12px;
    margin-top: 4px;
}

.buy {
    border: none;
    border-radius: 10px;
    background: var(--green);
    color: #071b0b;
    padding: 9px 12px;
    font-weight: bold;
    cursor: pointer;
    min-width: 105px;
}

.buy:hover {
    background: var(--light-green);
}

.buy:disabled {
    background: #38553b;
    color: #788d7b;
    cursor: not-allowed;
}

.bottom {
    width: min(1200px, 95%);
    margin: 20px auto;
}

.achievements {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px;
}

.achievement {
    padding: 14px;
    border-radius: 14px;
    background: #0b2410;
    opacity: .4;
}

.achievement.unlocked {
    opacity: 1;
    border: 1px solid var(--gold);
}

.achievement strong {
    display: block;
    color: var(--gold);
    margin-bottom: 5px;
}

.controls {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
}

.control-btn {
    border: none;
    border-radius: 10px;
    padding: 10px 15px;
    cursor: pointer;
    background: #284c2c;
    color: white;
}

.control-btn:hover {
    background: #37663c;
}

.reset {
    background: #5a2727;
}

.notice {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 10px;
}

@media(max-width: 850px) {
    .game {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🍇 Grape Clicker</h1>
    <p>Grow your grape empire!</p>
</header>

<div class="game">

<!-- TREE -->

<section class="panel tree-area" id="treeArea">

    <div class="stats">

        <div class="stat">
            <span class="stat-number" id="grapeCount">0</span>
            <span class="stat-label">Green Grapes</span>
        </div>

        <div class="stat">
            <span class="stat-number" id="gps">0</span>
            <span class="stat-label">Grapes / Second</span>
        </div>

        <div class="stat">
            <span class="stat-number" id="clickPower">1</span>
            <span class="stat-label">Grapes / Click</span>
        </div>

        <div class="stat">
            <span class="stat-number" id="criticalChance">5%</span>
            <span class="stat-label">Critical Chance</span>
        </div>

    </div>

    <button class="tree-button" id="treeButton">

        <svg class="tree-svg" viewBox="0 0 500 500">

            <defs>

                <radialGradient id="leafGradient">
                    <stop offset="0%" stop-color="#9cff72"/>
                    <stop offset="100%" stop-color="#238b31"/>
                </radialGradient>

                <linearGradient id="trunkGradient"
                    x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#512b12"/>
                    <stop offset="50%" stop-color="#8b5325"/>
                    <stop offset="100%" stop-color="#43230e"/>
                </linearGradient>

                <radialGradient id="grapeGradient">
                    <stop offset="0%" stop-color="#d9ff9d"/>
                    <stop offset="40%" stop-color="#65db3d"/>
                    <stop offset="100%" stop-color="#238b26"/>
                </radialGradient>

            </defs>

            <ellipse cx="250" cy="460"
                     rx="150" ry="25"
                     fill="rgba(0,0,0,.25)"/>

            <path d="M220 450
                     C225 390 220 330 205 275
                     C190 220 210 170 250 145
                     C290 170 310 220 295 275
                     C280 330 275 390 280 450Z"
                  fill="url(#trunkGradient)"/>

            <path d="M245 250 Q160 180 105 150"
                  fill="none"
                  stroke="#70401d"
                  stroke-width="25"
                  stroke-linecap="round"/>

            <path d="M260 240 Q350 170 405 145"
                  fill="none"
                  stroke="#70401d"
                  stroke-width="25"
                  stroke-linecap="round"/>

            <path d="M245 210 Q225 130 205 100"
                  fill="none"
                  stroke="#70401d"
                  stroke-width="18"
                  stroke-linecap="round"/>

            <circle cx="110" cy="125" r="75"
                    fill="url(#leafGradient)"/>

            <circle cx="185" cy="90" r="90"
                    fill="url(#leafGradient)"/>

            <circle cx="275" cy="75" r="95"
                    fill="url(#leafGradient)"/>

            <circle cx="365" cy="105" r="85"
                    fill="url(#leafGradient)"/>

            <circle cx="405" cy="165" r="70"
                    fill="url(#leafGradient)"/>

            <circle cx="95" cy="185" r="65"
                    fill="url(#leafGradient)"/>

            <!-- GRAPES -->

            <g fill="url(#grapeGradient)">

                <circle cx="125" cy="210" r="17"/>
                <circle cx="150" cy="220" r="17"/>
                <circle cx="175" cy="210" r="17"/>
                <circle cx="137" cy="240" r="17"/>
                <circle cx="162" cy="245" r="17"/>
                <circle cx="150" cy="270" r="17"/>

                <circle cx="350" cy="210" r="17"/>
                <circle cx="375" cy="220" r="17"/>
                <circle cx="400" cy="210" r="17"/>
                <circle cx="362" cy="240" r="17"/>
                <circle cx="387" cy="245" r="17"/>
                <circle cx="375" cy="270" r="17"/>

                <circle cx="240" cy="165" r="17"/>
                <circle cx="265" cy="165" r="17"/>
                <circle cx="252" cy="190" r="17"/>
                <circle cx="252" cy="215" r="17"/>

            </g>

            <g fill="#efffcf">

                <circle cx="119" cy="204" r="4"/>
                <circle cx="144" cy="214" r="4"/>
                <circle cx="344" cy="204" r="4"/>
                <circle cx="369" cy="214" r="4"/>
                <circle cx="234" cy="159" r="4"/>

            </g>

        </svg>

    </button>

    <div class="click-text">
        Click the grape tree!
    </div>

</section>


<!-- UPGRADES -->

<section class="panel">

    <div class="upgrades-title">

        <h2>🛒 Upgrades</h2>

        <span id="upgradeCount">
            0 upgrades
        </span>

    </div>

    <div class="upgrade-list"
         id="upgradeList">
    </div>

</section>

</div>


<!-- ACHIEVEMENTS -->

<div class="bottom">

<section class="panel">

    <h2>🏆 Achievements</h2>

    <div class="achievements"
         id="achievements">
    </div>

    <div class="controls">

        <button class="control-btn"
                id="saveButton">
            💾 Save Game
        </button>

        <button class="control-btn"
                id="exportButton">
            📋 Export Save
        </button>

        <button class="control-btn"
                id="importButton">
            📥 Import Save
        </button>

        <button class="control-btn reset"
                id="resetButton">
            🔄 Reset Game
        </button>

    </div>

    <div class="notice">
        Your game automatically saves every 10 seconds.
    </div>

</section>

</div>


<script>

/* =========================
   GAME VARIABLES
========================= */

let grapes = 0;

let grapesPerSecond = 0;

let clickPower = 1;

/*
    Starts at 5%.
    Critical Hit upgrade increases
    this by another 5% each time.
*/
let criticalChance = 0.05;

let totalClicks = 0;

let totalGrapes = 0;


/* =========================
   UPGRADES
========================= */

const upgrades = [

    {
        id: "vine",
        name: "Grape Vine",
        icon: "🌱",
        description: "+1 grape per second",
        baseCost: 25,
        multiplier: 1.15,
        production: 1
    },

    {
        id: "farmer",
        name: "Grape Farmer",
        icon: "👨‍🌾",
        description: "+3 grapes per second",
        baseCost: 150,
        multiplier: 1.18,
        production: 3
    },

    {
        id: "factory",
        name: "Grape Factory",
        icon: "🏭",
        description: "+50 grapes per second",
        baseCost: 750,
        multiplier: 1.20,
        production: 50
    },

    {
        id: "tractor",
        name: "Grape Tractor",
        icon: "🚜",
        description: "+250 grapes per second",
        baseCost: 4000,
        multiplier: 1.22,
        production: 250
    },

    {
        id: "laboratory",
        name: "Grape Laboratory",
        icon: "🧪",
        description: "+1,000 grapes per second",
        baseCost: 25000,
        multiplier: 1.25,
        production: 1000
    },

    {
        id: "empire",
        name: "Grape Empire",
        icon: "👑",
        description: "+5,000 grapes per second",
        baseCost: 150000,
        multiplier: 1.28,
        production: 5000
    },

    {
        id: "golden",
        name: "Golden Grape",
        icon: "🌟",
        description: "+25,000 grapes per second",
        baseCost: 1000000,
        multiplier: 1.30,
        production: 25000
    },

    {
        id: "supervine",
        name: "Super Vine",
        icon: "⚡",
        description: "+100,000 grapes per second",
        baseCost: 7500000,
        multiplier: 1.32,
        production: 100000
    },

    {
        id: "diamond",
        name: "Diamond Grape",
        icon: "💎",
        description: "+500,000 grapes per second",
        baseCost: 50000000,
        multiplier: 1.35,
        production: 500000
    },

    {
        id: "kingdom",
        name: "Grape Kingdom",
        icon: "🏰",
        description: "+2,500,000 grapes per second",
        baseCost: 500000000,
        multiplier: 1.40,
        production: 2500000
    },

    /* =========================
       CRITICAL HIT
    ========================= */

    {
        id: "critical",
        name: "Critical Hit",
        icon: "💥",
        description: "+5% critical chance",
        baseCost: 200,
        multiplier: 1.5,
        production: 0
    }

];


upgrades.forEach(upgrade => {

    upgrade.level = 0;

    upgrade.cost = upgrade.baseCost;

});


/* =========================
   ACHIEVEMENTS
========================= */

const achievements = [

    {
        id: "first",
        name: "First Grape",
        description: "Collect 1 grape",
        check: () => totalGrapes >= 1
    },

    {
        id: "hundred",
        name: "Little Vineyard",
        description: "Collect 100 grapes",
        check: () => totalGrapes >= 100
    },

    {
        id: "thousand",
        name: "Grape Lover",
        description: "Collect 1,000 grapes",
        check: () => totalGrapes >= 1000
    },

    {
        id: "million",
        name: "Grape Millionaire",
        description: "Collect 1,000,000 grapes",
        check: () => totalGrapes >= 1000000
    },

    {
        id: "clicker",
        name: "Click Master",
        description: "Click 1,000 times",
        check: () => totalClicks >= 1000
    },

    {
        id: "farmer",
        name: "Farm Owner",
        description: "Own 10 upgrades",
        check: () =>
            upgrades.reduce(
                (sum, u) => sum + u.level,
                0
            ) >= 10
    },

    {
        id: "factory",
        name: "Industrialist",
        description: "Reach 1,000 grapes/sec",
        check: () => grapesPerSecond >= 1000
    },

    {
        id: "empire",
        name: "Grape Emperor",
        description: "Reach 100,000 grapes/sec",
        check: () => grapesPerSecond >= 100000
    },

    {
        id: "critical",
        name: "Critical Master",
        description: "Reach 25% critical chance",
        check: () => criticalChance >= 0.25
    }

];

let unlockedAchievements = [];


/* =========================
   FORMAT NUMBERS
========================= */

function formatNumber(number) {

    if (number < 1000)
        return Math.floor(number).toLocaleString();

    if (number < 1000000)
        return (number / 1000).toFixed(1) + "K";

    if (number < 1000000000)
        return (number / 1000000).toFixed(1) + "M";

    if (number < 1000000000000)
        return (number / 1000000000).toFixed(1) + "B";

    return (number / 1000000000000).toFixed(1) + "T";
}


/* =========================
   RENDER UPGRADES
========================= */

function renderUpgrades() {

    const list =
        document.getElementById(
            "upgradeList"
        );

    list.innerHTML = "";

    upgrades.forEach(upgrade => {

        const div =
            document.createElement("div");

        div.className = "upgrade";

        let description =
            upgrade.description;

        if (upgrade.id === "critical") {

            description =
                "+5% critical chance • Critical clicks give 5× grapes";

        }

        div.innerHTML = `

            <div class="upgrade-icon">
                ${upgrade.icon}
            </div>

            <div>

                <h3>${upgrade.name}</h3>

                <p>${description}</p>

                <div class="upgrade-count">
                    Owned: ${upgrade.level}
                </div>

            </div>

            <button
                class="buy"
                onclick="buyUpgrade('${upgrade.id}')"
                ${grapes < upgrade.cost ? "disabled" : ""}
            >

                🍇 ${formatNumber(upgrade.cost)}

            </button>

        `;

        list.appendChild(div);

    });

}


/* =========================
   BUY UPGRADE
========================= */

function buyUpgrade(id) {

    const upgrade =
        upgrades.find(
            u => u.id === id
        );

    if (!upgrade)
        return;

    if (grapes < upgrade.cost)
        return;


    /* Pay for upgrade */

    grapes -= upgrade.cost;

    upgrade.level++;


    /* =========================
       NORMAL UPGRADES
    ========================= */

    if (upgrade.production > 0) {

        grapesPerSecond +=
            upgrade.production;

    }


    /* =========================
       CRITICAL HIT
    ========================= */

    if (upgrade.id === "critical") {

        criticalChance += 0.05;

        /*
            Maximum critical chance
            is 100%.
        */

        if (criticalChance > 1) {

            criticalChance = 1;

        }

    }


    /* =========================
       PRICE INCREASE
    ========================= */

    upgrade.cost =
        Math.floor(
            upgrade.baseCost *
            Math.pow(
                upgrade.multiplier,
                upgrade.level
            )
        );


    updateDisplay();

    renderUpgrades();

    checkAchievements();

    saveGame();

}


/* =========================
   CLICK TREE
========================= */

document
.getElementById("treeButton")
.addEventListener(
    "click",
    function(event) {

        totalClicks++;

        let amount =
            clickPower;

        let critical = false;


        /*
            Check if the click
            becomes critical.
        */

        if (
            Math.random() <
            criticalChance
        ) {

            amount *= 5;

            critical = true;

        }


        grapes += amount;

        totalGrapes += amount;


        createPopup(
            event.clientX,
            event.clientY,
            amount,
            critical
        );


        updateDisplay();

        checkAchievements();

    }
);


/* =========================
   POPUP
========================= */

function createPopup(
    x,
    y,
    amount,
    critical
) {

    const popup =
        document.createElement("div");

    popup.className =
        "popup" +
        (critical
            ? " critical-popup"
            : "");


    popup.style.left =
        (x - 35) + "px";

    popup.style.top =
        (y - 30) + "px";


    popup.innerHTML = `

        <span>

            ${critical
                ? "💥 CRITICAL! "
                : ""
            }

            +${formatNumber(amount)}

        </span>

        <span class="green-grape-popup">

            <span class="popup-grape popup-g1"></span>
            <span class="popup-grape popup-g2"></span>
            <span class="popup-grape popup-g3"></span>
            <span class="popup-grape popup-g4"></span>
            <span class="popup-grape popup-g5"></span>
            <span class="popup-grape popup-g6"></span>
            <span class="popup-grape popup-g7"></span>

        </span>

    `;


    document
    .getElementById("treeArea")
    .appendChild(popup);


    setTimeout(() => {

        popup.remove();

    }, 900);

}


/* =========================
   AUTOMATIC PRODUCTION
========================= */

setInterval(() => {

    grapes += grapesPerSecond;

    totalGrapes += grapesPerSecond;

    updateDisplay();

    checkAchievements();

}, 1000);


/* =========================
   UPDATE DISPLAY
========================= */

function updateDisplay() {

    document
    .getElementById("grapeCount")
    .textContent =
        formatNumber(grapes);


    document
    .getElementById("gps")
    .textContent =
        formatNumber(
            grapesPerSecond
        );


    document
    .getElementById("clickPower")
    .textContent =
        formatNumber(
            clickPower
        );


    document
    .getElementById("criticalChance")
    .textContent =
        Math.round(
            criticalChance * 100
        ) + "%";


    const owned =
        upgrades.reduce(
            (sum, upgrade) =>
                sum + upgrade.level,
            0
        );


    document
    .getElementById("upgradeCount")
    .textContent =
        owned + " upgrades";


    document
    .querySelectorAll(".buy")
    .forEach(
        (button, index) => {

            button.disabled =
                grapes <
                upgrades[index].cost;

        }
    );

}


/* =========================
   ACHIEVEMENTS
========================= */

function checkAchievements() {

    achievements.forEach(
        achievement => {

            if (
                achievement.check() &&
                !unlockedAchievements
                    .includes(
                        achievement.id
                    )
            ) {

                unlockedAchievements.push(
                    achievement.id
                );

            }

        }
    );

    renderAchievements();

}


function renderAchievements() {

    const container =
        document.getElementById(
            "achievements"
        );

    container.innerHTML = "";


    achievements.forEach(
        achievement => {

            const unlocked =
                unlockedAchievements
                    .includes(
                        achievement.id
                    );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "achievement" +
                (
                    unlocked
                        ? " unlocked"
                        : ""
                );


            div.innerHTML = `

                <strong>
                    ${unlocked
                        ? "🏆"
                        : "🔒"
                    }

                    ${achievement.name}

                </strong>

                <span>
                    ${achievement.description}
                </span>

            `;


            container.appendChild(div);

        }
    );

}


/* =========================
   SAVE
========================= */

function saveGame() {

    const saveData = {

        grapes,
        grapesPerSecond,
        clickPower,
        criticalChance,
        totalClicks,
        totalGrapes,
        unlockedAchievements,

        upgrades:
            upgrades.map(
                u => ({

                    id: u.id,

                    level: u.level,

                    cost: u.cost

                })
            )

    };


    localStorage.setItem(
        "grapeClickerSave",
        JSON.stringify(saveData)
    );

}


/* =========================
   LOAD
========================= */

function loadGame() {

    const saved =
        localStorage.getItem(
            "grapeClickerSave"
        );


    if (!saved)
        return;


    try {

        const data =
            JSON.parse(saved);


        grapes =
            data.grapes || 0;


        grapesPerSecond =
            data.grapesPerSecond || 0;


        clickPower =
            data.clickPower || 1;


        criticalChance =
            data.criticalChance ?? 0.05;


        totalClicks =
            data.totalClicks || 0;


        totalGrapes =
            data.totalGrapes || 0;


        unlockedAchievements =
            data.unlockedAchievements || [];


        if (data.upgrades) {

            data.upgrades.forEach(
                savedUpgrade => {

                    const upgrade =
                        upgrades.find(
                            u =>
                            u.id ===
                            savedUpgrade.id
                        );


                    if (upgrade) {

                        upgrade.level =
                            savedUpgrade.level || 0;


                        upgrade.cost =
                            savedUpgrade.cost ||
                            upgrade.baseCost;

                    }

                }
            );

        }

    }

    catch(error) {

        console.log(
            "Could not load save."
        );

    }

}


/* =========================
   EXPORT SAVE
========================= */

document
.getElementById("exportButton")
.addEventListener(
    "click",
    () => {

        saveGame();

        const save =
            localStorage.getItem(
                "grapeClickerSave"
            );


        prompt(
            "Copy your save code:",
            btoa(save)
        );

    }
);


/* =========================
   IMPORT SAVE
========================= */

document
.getElementById("importButton")
.addEventListener(
    "click",
    () => {

        const code =
            prompt(
                "Paste your save code:"
            );


        if (!code)
            return;


        try {

            const decoded =
                atob(code);


            localStorage.setItem(
                "grapeClickerSave",
                decoded
            );


            location.reload();

        }

        catch {

            alert(
                "Invalid save code!"
            );

        }

    }
);


/* =========================
   MANUAL SAVE
========================= */

document
.getElementById("saveButton")
.addEventListener(
    "click",
    () => {

        saveGame();

        alert(
            "Game saved! 🍇"
        );

    }
);


/* =========================
   RESET
========================= */

document
.getElementById("resetButton")
.addEventListener(
    "click",
    () => {

        const confirmed =
            confirm(
                "Are you sure you want to reset your entire grape empire?"
            );


        if (!confirmed)
            return;


        localStorage.removeItem(
            "grapeClickerSave"
        );


        location.reload();

    }
);


/* =========================
   AUTO SAVE
========================= */

setInterval(
    saveGame,
    10000
);


/* =========================
   START
========================= */

loadGame();

renderUpgrades();

renderAchievements();

updateDisplay();

</script>

</body>
</html>
