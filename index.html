<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍇 Grape Clicker</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background:
            radial-gradient(circle at top, #7136a8, #321452 55%, #180a29);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .game {
        width: 900px;
        max-width: 100%;
        background: rgba(20, 8, 37, 0.96);
        border: 1px solid #5d3180;
        border-radius: 28px;
        padding: 30px;
        text-align: center;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
    }

    h1 {
        margin: 0 0 12px;
        font-size: clamp(32px, 6vw, 52px);
    }

    .counter {
        font-size: clamp(30px, 5vw, 42px);
        font-weight: bold;
    }

    .per-second {
        color: #d8b9f4;
        margin-top: 5px;
        font-size: 18px;
    }

    .grape-area {
        position: relative;
        height: 280px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #grape {
        border: none;
        background: none;
        font-size: 150px;
        cursor: pointer;
        user-select: none;
        transition: transform 0.08s ease;
        filter: drop-shadow(0 15px 15px rgba(0,0,0,.35));
    }

    #grape:hover {
        transform: scale(1.08);
    }

    #grape:active {
        transform: scale(0.88);
    }

    .pop {
        position: absolute;
        pointer-events: none;
        font-size: 24px;
        font-weight: bold;
        color: #f1caff;
        animation: floatUp 0.7s ease-out forwards;
    }

    @keyframes floatUp {
        from {
            opacity: 1;
            transform: translateY(0);
        }

        to {
            opacity: 0;
            transform: translateY(-80px);
        }
    }

    .upgrades {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
    }

    .upgrade {
        min-height: 150px;
        border: 2px solid #583176;
        border-radius: 18px;
        background: #251039;
        color: white;
        padding: 18px;
        cursor: pointer;
        transition: 0.15s ease;
    }

    .upgrade:hover:not(:disabled) {
        transform: translateY(-4px);
        border-color: #a762d1;
        background: #301449;
    }

    .upgrade:active:not(:disabled) {
        transform: scale(0.97);
    }

    .upgrade:disabled {
        opacity: 0.45;
        cursor: not-allowed;
    }

    .upgrade-icon {
        font-size: 35px;
    }

    .upgrade-name {
        font-size: 20px;
        font-weight: bold;
        margin: 7px 0;
    }

    .upgrade-effect {
        color: #cdb3df;
        font-size: 14px;
    }

    .cost {
        margin-top: 12px;
        color: #ffd866;
        font-weight: bold;
    }

    .message {
        min-height: 28px;
        margin: 12px 0;
        color: #aaffb0;
        font-weight: bold;
    }

    #reset {
        margin-top: 22px;
        padding: 12px 24px;
        border: none;
        border-radius: 12px;
        background: #9447ca;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    #reset:hover {
        background: #a955df;
    }

    @media (max-width: 700px) {
        .game {
            padding: 20px;
        }

        .upgrades {
            grid-template-columns: 1fr;
        }

        .grape-area {
            height: 230px;
        }

        #grape {
            font-size: 120px;
        }
    }
</style>
</head>

<body>

<div class="game">

    <h1>🍇 Grape Clicker</h1>

    <div class="counter" id="grapes">
        0 grapes
    </div>

    <div class="per-second" id="perSecond">
        0 grapes per second
    </div>

    <div class="grape-area" id="grapeArea">
        <button id="grape" aria-label="Click grape">
            🍇
        </button>
    </div>

    <div class="message" id="message"></div>

    <div class="upgrades">

        <button class="upgrade" id="vine">
            <div class="upgrade-icon">🌱</div>
            <div class="upgrade-name">Grape Vine</div>
            <div class="upgrade-effect">
                +1 grape per second
            </div>
            <div class="cost" id="vineCost">
                Cost: 25
            </div>
        </button>

        <button class="upgrade" id="farmer">
            <div class="upgrade-icon">👨‍🌾</div>
            <div class="upgrade-name">Grape Farmer</div>
            <div class="upgrade-effect">
                +3 grapes per second
            </div>
            <div class="cost" id="farmerCost">
                Cost: 150
            </div>
        </button>

        <button class="upgrade" id="factory">
            <div class="upgrade-icon">🏭</div>
            <div class="upgrade-name">Grape Factory</div>
            <div class="upgrade-effect">
                +50 grapes per second
            </div>
            <div class="cost" id="factoryCost">
                Cost: 750
            </div>
        </button>

    </div>

    <button id="reset">
        Reset Game
    </button>

</div>

<script>

let grapes = Number(localStorage.getItem("grapes")) || 0;
let grapesPerSecond =
    Number(localStorage.getItem("grapesPerSecond")) || 0;

let vineCost =
    Number(localStorage.getItem("vineCost")) || 25;

let farmerCost =
    Number(localStorage.getItem("farmerCost")) || 150;

let factoryCost =
    Number(localStorage.getItem("factoryCost")) || 750;


const grapesDisplay = document.getElementById("grapes");
const perSecondDisplay = document.getElementById("perSecond");

const grapeButton = document.getElementById("grape");
const grapeArea = document.getElementById("grapeArea");

const vineButton = document.getElementById("vine");
const farmerButton = document.getElementById("farmer");
const factoryButton = document.getElementById("factory");

const vineCostDisplay = document.getElementById("vineCost");
const farmerCostDisplay = document.getElementById("farmerCost");
const factoryCostDisplay = document.getElementById("factoryCost");

const message = document.getElementById("message");


function saveGame() {

    localStorage.setItem("grapes", grapes);
    localStorage.setItem("grapesPerSecond", grapesPerSecond);

    localStorage.setItem("vineCost", vineCost);
    localStorage.setItem("farmerCost", farmerCost);
    localStorage.setItem("factoryCost", factoryCost);
}


function updateDisplay() {

    grapesDisplay.textContent =
        Math.floor(grapes).toLocaleString() + " grapes";

    perSecondDisplay.textContent =
        grapesPerSecond.toLocaleString() +
        " grapes per second";

    vineCostDisplay.textContent =
        "Cost: " + vineCost.toLocaleString();

    farmerCostDisplay.textContent =
        "Cost: " + farmerCost.toLocaleString();

    factoryCostDisplay.textContent =
        "Cost: " + factoryCost.toLocaleString();

    vineButton.disabled = grapes < vineCost;
    farmerButton.disabled = grapes < farmerCost;
    factoryButton.disabled = grapes < factoryCost;
}


function showMessage(text) {

    message.textContent = text;

    setTimeout(function() {
        message.textContent = "";
    }, 1200);
}


function createPopText(text) {

    const pop = document.createElement("div");

    pop.className = "pop";
    pop.textContent = text;

    pop.style.left =
        (45 + Math.random() * 10) + "%";

    pop.style.top =
        (45 + Math.random() * 10) + "%";

    grapeArea.appendChild(pop);

    setTimeout(function() {
        pop.remove();
    }, 700);
}


// Click grape
grapeButton.addEventListener("click", function() {

    grapes += 1;

    createPopText("+1 🍇");

    updateDisplay();
    saveGame();

});


// Buy Vine
vineButton.addEventListener("click", function() {

    if (grapes < vineCost) return;

    grapes -= vineCost;

    grapesPerSecond += 1;

    vineCost =
        Math.floor(vineCost * 1.15);

    showMessage("🌱 Grape Vine purchased!");

    updateDisplay();
    saveGame();

});


// Buy Farmer
farmerButton.addEventListener("click", function() {

    if (grapes < farmerCost) return;

    grapes -= farmerCost;

    grapesPerSecond += 3;

    farmerCost =
        Math.floor(farmerCost * 1.18);

    showMessage("👨‍🌾 Grape Farmer hired!");

    updateDisplay();
    saveGame();

});


// Buy Factory
factoryButton.addEventListener("click", function() {

    if (grapes < factoryCost) return;

    grapes -= factoryCost;

    grapesPerSecond += 50;

    factoryCost =
        Math.floor(factoryCost * 1.20);

    showMessage("🏭 Grape Factory purchased!");

    updateDisplay();
    saveGame();

});


// Automatic production
setInterval(function() {

    grapes += grapesPerSecond;

    updateDisplay();
    saveGame();

}, 1000);


// Reset
document.getElementById("reset")
.addEventListener("click", function() {

    const confirmed =
        confirm("Are you sure you want to reset your grape empire?");

    if (!confirmed) return;

    grapes = 0;
    grapesPerSecond = 0;

    vineCost = 25;
    farmerCost = 150;
    factoryCost = 750;

    saveGame();
    updateDisplay();

    showMessage("🔄 Game reset!");

});


updateDisplay();

</script>

</body>
</html>
